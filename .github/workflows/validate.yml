name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Check generated corpus indexes
        run: python3 scripts/build_corpus.py --check
      - name: Check release metadata
        run: python3 scripts/validate_version.py
      - name: Check evaluation contracts
        run: python3 scripts/validate_evals.py
      - name: Run deterministic tool tests
        run: python3 -m unittest discover -s tests
      - name: Validate repository
        run: python3 scripts/validate_repository.py
